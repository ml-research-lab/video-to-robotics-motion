[project]
name = "webcam-teleop"
version = "0.1.0"
description = "Webcam hand-tracking teleoperation of simulated robot arms and dexterous hands"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mediapipe>=0.10.14,<0.11",
    "opencv-python>=4.10,<5",
    "mujoco>=3.1.6,<4",
    "mink>=0.0.4",
    "numpy>=1.26,<2",
    "dearpygui>=1.11,<3",
    "robot_descriptions>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webcam_teleop"]
